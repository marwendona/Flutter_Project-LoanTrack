name: loantrack
description: "LoanTrack — suivi personnel et hors ligne des prêts d'argent."
publish_to: 'none'

# versionName+versionCode : incrémenter le numéro après « + » à chaque APK.
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  # Version stable utilisée à l'initialisation (E0).
  flutter: ">=3.47.9"

dependencies:
  clock: ^1.1.3
  drift: ^2.35.3
  dynamic_color: ^2.1.0
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  # Version imposée par flutter_localizations.
  intl: any
  json_annotation: ^4.12.0
  material_ui: ^1.9.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
